<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noche Cero Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101318;color:#eee;font-family:system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#2b6cb0;color:#fff;font-weight:700}button.secondary{background:#30343b}button:disabled{opacity:.45}
#app{max-width:1200px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:25px;margin:0}.badge{background:#242931;padding:7px 10px;border-radius:99px;font-size:13px}
.card,.panel{background:#181c22;border:1px solid #2b3038;border-radius:14px;padding:16px;margin-top:14px}.hidden{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{background:#0f1216;border:1px solid #363c45;color:#fff;padding:11px;border-radius:10px;width:180px}
#board{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:#080a0d;padding:5px;border-radius:10px;max-width:720px;aspect-ratio:1;margin:auto}
.cell{position:relative;background:#3b3f3a;border-radius:3px;overflow:hidden}.cell.wall{background:#20242a}
.entity{position:absolute;inset:3px;display:grid;place-items:center;border-radius:7px;font-size:clamp(15px,3vw,26px);font-weight:900}.survivor{background:#246b53}.survivor.other{background:#3b6280}.survivor.me{outline:2px solid #7de2b0}.zombie{background:#722f35}.hp{position:absolute;bottom:1px;right:3px;font-size:9px}
.layout{display:grid;grid-template-columns:minmax(300px,1fr) 320px;gap:14px;margin-top:14px}.panel{margin-top:0}.log{height:220px;overflow:auto;background:#0e1115;padding:10px;border-radius:10px;font-size:13px}.log div{margin-bottom:6px}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #2b3038}.actions button{margin:3px}.hint{font-size:13px;color:#aeb6c2}.title{font-weight:800;margin-bottom:8px}.bigcode{font-size:30px;letter-spacing:6px;font-weight:900;padding:12px 0}.ok{color:#7de2b0}.error{color:#ff8d8d}
@media(max-width:800px){.layout{grid-template-columns:1fr}.panel{order:2}#board{max-width:95vw}}
</style>
</head>
<body>
<div id="app">
<div class="top"><h1>🧟 Noche Cero Online</h1><div><span id="roomBadge" class="badge">Sin sala</span> <span id="turnBadge" class="badge">—</span></div></div>

<section id="home" class="card">
<div class="title">Partida cooperativa online</div>
<div class="row"><input id="name" placeholder="Tu nombre" maxlength="18"><button onclick="createRoom()">Crear partida</button></div>
<div class="row" style="margin-top:10px"><input id="roomInput" placeholder="Código de sala" maxlength="6"><button onclick="joinRoom()">Unirse a partida</button></div>
<p id="status" class="hint">Conectando con Firebase…</p>
</section>

<section id="lobby" class="card hidden">
<div class="title">Sala creada</div><div class="bigcode" id="code"></div><div id="players" class="hint"></div>
<p class="hint">Pasa este código al segundo jugador. Cuando esté dentro, el creador puede empezar.</p>
<button id="startBtn" onclick="startGame()">▶️ Empezar partida</button> <button class="secondary" onclick="location.reload()">Salir</button>
</section>

<main id="game" class="hidden"><div class="layout"><section class="panel"><div id="board"></div></section>
<aside class="panel"><div class="title">Supervivientes</div><div id="survivors"></div>
<div class="title" style="margin-top:14px">Acciones</div>
<div class="actions"><button id="moveBtn" onclick="mode='move';refresh()">🚶 Mover</button><button id="attackBtn" onclick="mode='attack';refresh()">⚔️ Atacar</button><button class="secondary" onclick="endTurn()">⏭️ Terminar turno</button></div>
<p id="modeHint" class="hint">Elige una acción.</p><div class="title" style="margin-top:14px">Registro</div><div id="log" class="log"></div></aside></div></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyAYQxlF76gthAJpGRSyB8DZXhBrL5snSFo",
 authDomain:"noche-cero.firebaseapp.com",
 projectId:"noche-cero",
 storageBucket:"noche-cero.firebasestorage.app",
 messagingSenderId:"843719164928",
 appId:"1:843719164928:web:3a5730c10b7fa0ceb004e5",
 databaseURL:"https://noche-cero-default-rtdb.europe-west1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database(),W=10,H=10;
let uid=null,room="",player=-1,mode="select",state=null,ref=null;

function initial(){return{started:false,turn:0,active:0,winner:null,
survivors:[{id:0,name:"Jugador 1",x:1,y:1,hp:5,maxHp:5,actions:3,attack:2},{id:1,name:"Jugador 2",x:8,y:8,hp:5,maxHp:5,actions:3,attack:2}],
zombies:[{id:1,x:5,y:2,hp:2,maxHp:2},{id:2,x:6,y:7,hp:1,maxHp:1},{id:3,x:2,y:6,hp:1,maxHp:1}],
log:["La noche comienza. Sobrevive y elimina a los zombies."]}}
function roomCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function clean(s){return String(s||"").trim().replace(/[.#$\[\]]/g,"").slice(0,18)}
function status(t,c){const e=document.getElementById("status");e.textContent=t;e.className=c||"hint"}

auth.signInAnonymously().then(r=>{uid=r.user.uid;status("Conectado. Puedes crear o unirte a una sala.","ok")}).catch(e=>status("Error de Firebase: "+e.message,"error"));

async function createRoom(){
 if(!uid)return alert("Espera a que Firebase termine de conectar.");
 const name=clean(document.getElementById("name").value)||"Jugador 1";room=roomCode();player=0;
 const s=initial();s.survivors[0].name=name;
 await db.ref("rooms/"+room).set({host:uid,players:{[uid]:0},names:{[uid]:name},state:s});
 listen();showLobby();
}
async function joinRoom(){
 if(!uid)return alert("Espera a que Firebase termine de conectar.");
 room=document.getElementById("roomInput").value.trim().toUpperCase();
 if(room.length<4)return alert("Introduce el código de sala.");
 const snap=await db.ref("rooms/"+room).get();if(!snap.exists())return alert("No existe esa sala.");
 const d=snap.val();if(d.state&&d.state.started)return alert("La partida ya ha comenzado.");
 const players=d.players||{};if(Object.keys(players).length>=2)return alert("La sala ya tiene 2 jugadores.");
 const name=clean(document.getElementById("name").value)||"Jugador 2";player=1;
 await db.ref("rooms/"+room+"/players/"+uid).set(1);await db.ref("rooms/"+room+"/names/"+uid).set(name);await db.ref("rooms/"+room+"/state/survivors/1/name").set(name);
 listen();showLobby();
}
function listen(){
 if(ref)ref.off();
 ref=db.ref("rooms/"+room);
 ref.on("value",snap=>{
  if(!snap.exists()){alert("La sala ya no existe.");location.reload();return}
  const d=snap.val();state=d.state||initial();refreshLobby(d);
  if(state.started){document.getElementById("lobby").classList.add("hidden");document.getElementById("game").classList.remove("hidden");refresh()}
 });
}
function showLobby(){document.getElementById("home").classList.add("hidden");document.getElementById("lobby").classList.remove("hidden")}
function refreshLobby(d){
 document.getElementById("code").textContent=room;
 const names=d.names||{};document.getElementById("players").innerHTML="Jugadores conectados: "+Object.values(names).map(n=>"<b>"+n+"</b>").join(" · ");
 document.getElementById("startBtn").disabled=player!==0||Object.keys(d.players||{}).length<2;
}
async function startGame(){if(player!==0)return;state.started=true;await db.ref("rooms/"+room+"/state").set(state)}

function wall(x,y){return(x===4&&y<3)||(x===4&&y>6)||(y===4&&x<2)||(y===4&&x>7)}
function occupied(x,y){return state.survivors.some(s=>s.hp>0&&s.x===x&&s.y===y)||state.zombies.some(z=>z.hp>0&&z.x===x&&z.y===y)}
function adjacent(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1}
function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}
function addLog(t){state.log.unshift(t);state.log=state.log.slice(0,80)}
function save(){return db.ref("rooms/"+room+"/state").set(state)}

function refresh(){
 document.getElementById("roomBadge").textContent="Sala "+room;
 document.getElementById("turnBadge").textContent=state.winner||("Turno "+(state.turn+1)+" · "+(state.active===player?"Tu turno":"Turno del otro jugador"));
 renderBoard();document.getElementById("survivors").innerHTML=state.survivors.map(s=>"<div class='stat'><span>"+(s.id===player?"👉 ":"")+s.name+"</span><span>❤ "+s.hp+"/"+s.maxHp+" · ⚡ "+s.actions+"</span></div>").join("");
 document.getElementById("log").innerHTML=state.log.map(x=>"<div>"+x+"</div>").join("");
 document.getElementById("modeHint").textContent=state.winner?"Partida terminada.":state.active!==player?"Espera tu turno.":mode==="move"?"Elige una casilla adyacente.":mode==="attack"?"Elige un zombie adyacente.":"Elige Mover o Atacar.";
 document.getElementById("moveBtn").disabled=state.active!==player||!!state.winner;document.getElementById("attackBtn").disabled=state.active!==player||!!state.winner;
}
function renderBoard(){
 const b=document.getElementById("board");b.innerHTML="";
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const c=document.createElement("div");c.className="cell"+(wall(x,y)?" wall":"");c.onclick=()=>clickCell(x,y);
  const s=state.survivors.find(v=>v.hp>0&&v.x===x&&v.y===y),z=state.zombies.find(v=>v.hp>0&&v.x===x&&v.y===y);
  if(s){const e=document.createElement("div");e.className="entity survivor "+(s.id===player?"me":"other");e.innerHTML="🧑<span class='hp'>❤"+s.hp+"</span>";c.appendChild(e)}
  if(z){const e=document.createElement("div");e.className="entity zombie";e.innerHTML="🧟<span class='hp'>❤"+z.hp+"</span>";c.appendChild(e)}
  b.appendChild(c);
 }
}
async function clickCell(x,y){
 if(state.winner||state.active!==player)return;
 const s=state.survivors[player],z=state.zombies.find(v=>v.hp>0&&v.x===x&&v.y===y);
 if(mode==="move"&&Math.abs(s.x-x)+Math.abs(s.y-y)===1&&!occupied(x,y)&&!wall(x,y)&&s.actions>0){s.x=x;s.y=y;s.actions--;addLog(s.name+" se mueve.");mode="select";return save()}
 if(mode==="attack"&&z&&adjacent(s,z)&&s.actions>0){s.actions--;const roll=Math.floor(Math.random()*6)+1,dmg=roll>=4?s.attack:0;addLog(s.name+" tira "+roll+": "+(dmg?"impacto":"fallo")+"."),z.hp-=dmg;if(z.hp<=0)addLog("🧟 Zombie eliminado.");checkWin();mode="select";return save()}
}
async function endTurn(){
 if(state.winner||state.active!==player)return;
 state.survivors[player].actions=0;state.active=1-state.active;
 if(state.active===0){state.turn++;state.survivors.forEach(s=>{if(s.hp>0)s.actions=3});zombiePhase()}else state.survivors.forEach(s=>{if(s.hp>0)s.actions=3});
 mode="select";await save();
}
function zombiePhase(){
 addLog("🧟 Los zombies se mueven...");
 for(const z of state.zombies.filter(v=>v.hp>0)){
  const target=state.survivors.filter(s=>s.hp>0).sort((a,b)=>dist(z,a)-dist(z,b))[0];if(!target)continue;
  if(adjacent(z,target)){target.hp--;addLog("🩸 Un zombie hiere a "+target.name+".");continue}
  const dx=Math.sign(target.x-z.x),dy=Math.sign(target.y-z.y),tries=Math.abs(target.x-z.x)>=Math.abs(target.y-z.y)?[[dx,0],[0,dy]]:[[0,dy],[dx,0]];
  for(const q of tries){const nx=z.x+q[0],ny=z.y+q[1];if(nx>=0&&nx<W&&ny>=0&&ny<H&&!occupied(nx,ny)&&!wall(nx,ny)){z.x=nx;z.y=ny;break}}
 }
 if(state.turn%2===0){const spots=[[0,9],[9,0],[0,0],[9,9]].filter(p=>!occupied(p[0],p[1]));if(spots.length){const p=spots[Math.floor(Math.random()*spots.length)];state.zombies.push({id:Date.now(),x:p[0],y:p[1],hp:1,maxHp:1});addLog("⚠️ Aparece un nuevo zombie.")}}
 checkWin();
}
function checkWin(){if(state.zombies.every(z=>z.hp<=0))state.winner="🏆 ¡Habéis sobrevivido!";else if(state.survivors.every(s=>s.hp<=0))state.winner="☠️ Los supervivientes han caído."}
</script>
</body>
</html>
